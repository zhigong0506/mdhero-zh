name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Unit tests
        run: pnpm test

      - name: Type check
        run: pnpm check

  rust-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-build validates that frontendDist (../build) exists, so the
      # frontend has to be built before cargo touches the crate.
      - name: Build frontend
        run: pnpm install && pnpm build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

  # Windows only. This fork ships unsigned installers and has no macOS or Linux
  # distribution, so the matrix previously covering five platforms was removed
  # along with every signing/notarization step that needed Apple secrets.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows
          - platform: windows-11-arm
            name: Windows 11 ARM

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('MDHero {0}', github.ref_name) || '' }}
          releaseBody: |
            See the full changelog in the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}).

            ## Install
            - **Windows** (x64 or ARM64): Download the `.msi` installer or `-setup.exe` (NSIS) — pick the `x64` or `arm64` file for your machine
          releaseDraft: true
          prerelease: false
          # No updater artifacts are produced (the app ships without an in-app
          # updater), so there is no latest.json to assemble.
          includeUpdaterJson: false

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: mdhero-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

  # Tag builds are assembled as a draft by tauri-action and promoted here only
  # after every Windows target succeeded AND the expected assets are actually
  # present. An upload with `if-no-files-found: ignore` passes while producing
  # nothing, so presence is asserted instead of inferred; anything missing
  # leaves the release invisible as a draft.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Verify the draft is complete, then publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          echo "assets on the draft:"
          printf '%s\n' "$assets" | sed 's/^/  /'

          missing=0
          for pat in '[.]msi$' '[-]setup[.]exe$'; do
            if ! printf '%s\n' "$assets" | grep -qE "$pat"; then
              echo "::error::no asset matches /$pat/ — leaving $tag as a draft"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $tag"
